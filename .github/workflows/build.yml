name: build
# Builds xinput1_3.dll from the tagged source with the pinned toolchain (ziglang 0.17.0),
# checks the build is reproducible, and publishes the DLL and its sha256 as release assets.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.0"
      - name: Native tests
        run: bash tests/run.sh
      - name: Build twice and compare
        run: bash verify.sh | tee verify.txt
      - name: Build the release files
        run: |
          mkdir -p dist
          RELEASE_OUT="$PWD/dist" bash build.sh
          cd dist
          sha256sum xinput1_3.dll photo-mode-licenses.txt | tee SHA256SUMS
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes "Built by GitHub Actions from this tag with ziglang 0.17.0. The sha256 of xinput1_3.dll is in SHA256SUMS; ./verify.sh reproduces it." \
            dist/xinput1_3.dll dist/photo-mode-licenses.txt dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Uploads the release to Nexus Mods. Waits for approval: the `nexus-release` environment has
  # a required reviewer, so the run shows a "Review deployments" button when the build is done.
  nexus:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    environment: nexus-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Make the Nexus zip
        run: |
          v="${GITHUB_REF_NAME#v}"
          python3 - "$v" <<'PY'
          import sys, zipfile
          v = sys.argv[1]
          with zipfile.ZipFile(f"DS2-Photo-Mode-{v}.zip", "w", zipfile.ZIP_DEFLATED) as z:
              for name in ("xinput1_3.dll", "photo-mode-licenses.txt"):
                  z.write(f"dist/{name}", name)
              for name in ("LICENSE.txt", "NOTICE.txt"):
                  z.write(name, name)
              z.writestr("README.txt", open("NEXUS-README.txt", encoding="utf-8").read().replace("{version}", v))
          PY
          sha256sum dist/xinput1_3.dll
      - name: Upload to Nexus
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          python3 nexus_upload.py "$v" "DS2-Photo-Mode-$v.zip"
